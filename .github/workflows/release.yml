name: Release

on:
  push:
    tags:
      - '*'
  # 手动触发用于试跑打包链路（不发 Release，版本号取 Cargo.toml）
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 版本号唯一来源：tag。顺带校验 Cargo.toml 已同步，并产出「含子模块」的
  # 源码包（GitHub 自动生成的 /archive/ 包不含 rime-wubi，rpm/arch 构建依赖它）。
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: resolve
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::tag ${VERSION} 与 Cargo.toml 的版本 ${CARGO_VERSION} 不一致"
              exit 1
            fi
          else
            VERSION="$CARGO_VERSION"
            echo "::warning::手动触发：按 Cargo.toml 的版本 ${VERSION} 试构建，不会创建 Release"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          # 先写到工作区外：输出文件如果落在被归档的目录里，tar 会读到
          # 自己正在写的文件，报 "file changed as we read it"（退出码 1，
          # bash -e 下直接判失败）。
          tar \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./target \
            --transform "s|^\./|XimeChe-$VERSION/|" \
            -czf "$RUNNER_TEMP/xime-$VERSION.tar.gz" .
          mv "$RUNNER_TEMP/xime-$VERSION.tar.gz" .

      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: xime-source
          path: xime-*.tar.gz
          if-no-files-found: error

  # Debian / Ubuntu / Mint 等：.deb + 便携 tarball。
  #
  # 出两个变体（cargo-deb 的 variants）：
  #   xime_<ver>_amd64.deb      纯 CPU 版语音引擎，任何机器都能跑；
  #   xime-cuda_<ver>_amd64.deb CUDA 版语音引擎，识别延迟低一个量级。
  # 两者文件清单相同、只差 xime-speechd 的后端，所以声明冲突（apt 会提示替换）。
  #
  # 语音引擎 xime-speechd 不在本仓库，来自 libximecore：这里显式 clone 一份
  # 并在它里面单独构建（candle + cpal，编得比输入法本身慢得多）。
  deb:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            deb_args: ""
            speech_features: ""
          - variant: cuda
            deb_args: "--variant cuda"
            speech_features: "--features cuda"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            pkg-config

      # 直接用 NVIDIA 的 apt 源，不用 Jimver/cuda-toolkit：那个 action 的可用
      # 版本是源码里写死的数组（v0.2.19 最新 12.6.2），而且它装的是 cuda-12-6
      # 元包——依赖链带 nvidia-open-560 驱动包，CI 上没 GPU 纯属浪费。
      # 这里只装编译器 + 开发库；补丁版本由源决定（现 12.6.3），soname 仍是
      # libcudart.so.12，覆盖所有 CUDA 12.x 运行时，minor version
      # compatibility 保证旧 12.x 驱动也能加载。
      # 编 CUDA 不需要 GPU，nvcc 是纯交叉编译。但 runner 上没有 nvidia-smi，
      # cudaforge 探测不到架构会直接报错（不是回落默认值），所以必须显式钉。
      # 同一 major 内 cubin 向上兼容，所以 sm_80 能跑 30/40 系（sm_86/89）。
      - name: Install CUDA toolkit
        if: matrix.variant == 'cuda'
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-compiler-12-6 cuda-libraries-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      - name: Pin a GCC that CUDA 12.6 accepts
        if: matrix.variant == 'cuda'
        run: |
          sudo apt-get install -y gcc-12 g++-12
          echo "NVCC_CCBIN=/usr/bin/g++-12" >> "$GITHUB_ENV"
          echo "CUDA_COMPUTE_CAP=80" >> "$GITHUB_ENV"
          # 安装成功不等于 nvcc 进了 PATH（cudarc 是直接调 `nvcc`，不认
          # CUDA_HOME）；在这里失败，比等 candle 编到一半再报错好排查。
          nvcc --version

      # 说明：Cargo.lock 里 libximecore 相关 crate 被本地 .cargo/config.toml
      # patch 成路径依赖（无 git 条目），CI 上没有该 patch，cargo 会从 GitHub
      # 解析 libximecore@main 并自行补全锁文件——这就是发版构建的实际依赖来源。
      # 这里把需要的那几个 crate 也 patch 到刚 clone 的副本上，保证输入法与
      # 语音引擎编自同一份代码（librime 不在这场 patch 里：它仍走 git 依赖，
      # 否则要连带构建 librime 子模块）。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Point cargo at the cloned libximecore
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch."https://github.com/ximeiorg/libximecore"]
          xime-config = { path = "../libximecore/crates/xime-config" }
          xime-setup-lib = { path = "../libximecore/crates/xime-setup" }
          xime-plugin = { path = "../libximecore/crates/xime-plugin" }
          xime-speech-service = { path = "../libximecore/crates/xime-speech-service" }
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ../libximecore/target
          key: ${{ runner.os }}-${{ matrix.variant }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.variant }}-cargo-release-
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release

      # 语音引擎单独构建：--manifest-path 指到 clone 出来的 libximecore，产物
      # 落在它自己的 target 下，拷回本仓库的 target/release 后由 cargo-deb 收进包。
      - name: Build speech daemon (${{ matrix.variant }})
        run: |
          cargo build --release \
            --manifest-path ../libximecore/Cargo.toml \
            -p xime-speechd ${{ matrix.speech_features }}
          cp ../libximecore/target/release/xime-speechd target/release/xime-speechd

      - name: Build Debian package
        # 先清空：cache 可能把上一次构建的 deb 一起恢复回来，后面 ls 会撞见两个包。
        run: |
          rm -rf target/debian
          cargo deb -p xime --no-build ${{ matrix.deb_args }}

      # 打包结果自查：两个变体只该差语音后端，别把 CPU 版误发成 CUDA 版。
      - name: Inspect package
        run: |
          deb=$(ls target/debian/*.deb)
          echo "== $deb"
          dpkg-deb -f "$deb" Package Version Depends Conflicts
          dpkg-deb -c "$deb" | grep -E 'usr/bin/xime-(daemon|speechd|launcher|setup)$'
          dpkg-deb -c "$deb" | grep -q 'usr/bin/xime-speechd$' \
            || { echo "::error::deb 里没有 xime-speechd"; exit 1; }
          # 真凭实据地确认后端：ldd 认 libcudart 的才允许叫 cuda 变体。
          # （CUDA 版在 runner 上可能显示 not found——库路径没进 ld.so 缓存，
          #   但 soname 会照样打印出来，用来判定足够了。）
          extract=$(mktemp -d)
          dpkg-deb -x "$deb" "$extract"
          if ldd "$extract/usr/bin/xime-speechd" | grep -q libcudart; then
            echo "语音后端：cuda"
            test "${{ matrix.variant }}" = "cuda" \
              || { echo "::error::CPU 变体却链接了 CUDA"; exit 1; }
            # ldd 只证明「声明了 libcudart 依赖」，证明不了 kernel 真被编进去——
            # 工具链静默跳过 kernel 编译时，链接照样成功。cuobjdump 直接列出
            # 二进制内嵌的 cubin，架构必须是 CUDA_COMPUTE_CAP 钉的那个。
            cuobjdump=$(command -v cuobjdump \
              || ls -d /usr/local/cuda*/bin/cuobjdump 2>/dev/null | sort -V | tail -1)
            test -n "$cuobjdump" \
              || { echo "::error::找不到 cuobjdump，CUDA 工具链没装好"; exit 1; }
            "$cuobjdump" -lelf "$extract/usr/bin/xime-speechd" > /tmp/cubins.txt
            cubins=$(grep -c '\.sm_80\.cubin' /tmp/cubins.txt || true)
            echo "内嵌 sm_80 cubin：${cubins} 个（共 $(wc -l < /tmp/cubins.txt) 行）"
            test "$cubins" -gt 0 \
              || { echo "::error::CUDA 变体里没有 sm_80 cubin，kernel 没编进去"; exit 1; }
          else
            echo "语音后端：cpu"
            test "${{ matrix.variant }}" = "cpu" \
              || { echo "::error::CUDA 变体没有链接 CUDA"; exit 1; }
          fi

      - name: Build portable tarball
        if: matrix.variant == 'cpu'
        run: |
          VERSION="${{ needs.source.outputs.version }}"
          ./packaging/stage.sh "$PWD/target/stage" /usr
          tar --owner=0 --group=0 --numeric-owner \
            -C target/stage -czf "xime-$VERSION-x86_64-linux.tar.gz" .

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: xime-deb-${{ matrix.variant }}
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload portable tarball
        if: matrix.variant == 'cpu'
        uses: actions/upload-artifact@v4
        with:
          name: xime-tarball
          path: xime-*-x86_64-linux.tar.gz
          if-no-files-found: error

  # Fedora / RHEL / openSUSE 等：.rpm（在 Fedora 容器里真编真打）
  rpm:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git (checkout 需要)
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build redhat-rpm-config \
            cargo rust \
            gcc gcc-c++ make pkgconf-pkg-config \
            librime-devel libxkbcommon-devel libxkbcommon-x11-devel \
            wayland-devel dbus-devel fontconfig-devel freetype-devel \
            clang clang-devel

      - name: Build RPM
        run: |
          VERSION="${{ needs.source.outputs.version }}"
          sed -i "s/^Version:.*/Version:        $VERSION/" packaging/rpm/xime.spec
          mkdir -p rpmbuild/SOURCES
          tar \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./target \
            --exclude=./rpmbuild \
            --transform "s|^\./|XimeChe-$VERSION/|" \
            -czf "rpmbuild/SOURCES/xime-$VERSION.tar.gz" .
          rpmbuild -bb packaging/rpm/xime.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "dist .fc$(rpm -E %fedora)" \
            --define "debug_package %{nil}"

      - name: Smoke test
        run: |
          dnf install -y ./rpmbuild/RPMS/*/*.rpm
          ldd /usr/bin/xime-daemon
          test -f /usr/share/dbus-1/services/org.xime.Xime.service
          test -f /usr/share/xime/rime-data/wubi86.schema.yaml

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: xime-rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  # Arch / Manjaro / EndeavourOS 等：.pkg.tar.zst（直接跑 PKGBUILD，顺带验证它）
  arch:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git (checkout 需要)
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: pacman -S --noconfirm --needed rust librime libxkbcommon libxkbcommon-x11 wayland dbus fontconfig freetype2 hicolor-icon-theme pkgconf clang

      - name: Build package
        run: |
          VERSION="${{ needs.source.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --nodeps --nocheck --noconfirm"

      # 装上验证：daemon 必须能按 rpath 找到随包分发的语音库，
      # 并确认方案数据 / DBus 服务到位；namcap 只作提示。
      - name: Smoke test
        run: |
          pacman -S --noconfirm --needed namcap
          namcap packaging/arch/*.pkg.tar.zst || true
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          ldd /usr/bin/xime-daemon
          test -x /usr/bin/xime-launcher
          test -f /usr/share/dbus-1/services/org.xime.Xime.service
          test -f /usr/share/xime/rime-data/wubi86.schema.yaml

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: xime-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

      # AUR 提交物：PKGBUILD + .SRCINFO + install 钩子（pkgver 已按 tag 覆写），
      # 解开直接推到 aur.archlinux.org 的空仓库里即可。
      - name: Generate AUR metadata
        run: |
          cd packaging/arch
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --printsrcinfo" > .SRCINFO
          # 下面两步刻意不做静默判断：一旦失败就把 .SRCINFO 打出来，
          # 避免出现「exit code 1 但日志空白」这种无从下手的失败。
          if [ ! -s .SRCINFO ]; then
            echo "::error::makepkg --printsrcinfo 没有产出内容（.SRCINFO 为空）"
            exit 1
          fi
          head -3 .SRCINFO
          # .SRCINFO 里除 pkgbase 外所有字段（含 pkgver）都带 TAB 缩进，
          # 行首锚定的 ^pkgver 永远匹配不上。
          if ! grep -qE '^[[:space:]]*pkgver = ' .SRCINFO; then
            echo "::error::.SRCINFO 缺少 pkgver 字段，内容如下："
            cat .SRCINFO
            exit 1
          fi
          tar -czf "$GITHUB_WORKSPACE/xime-${{ needs.source.outputs.version }}-aur.tar.gz" \
            PKGBUILD .SRCINFO xime.install

      - name: Upload AUR files
        uses: actions/upload-artifact@v4
        with:
          name: xime-aur
          path: xime-*-aur.tar.gz
          if-no-files-found: error

  release:
    needs: [source, deb, rpm, arch]
    # 手动触发的试跑只产出 artifact，不建 Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
