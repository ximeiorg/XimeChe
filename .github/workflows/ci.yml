name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # .cargo/config.toml 把 libximecore patch 到 ../libximecore（本地开发
      # 工作流）；CI 上不存在该路径时 cargo 回退 Cargo.lock 锁定的旧 rev，
      # 缺语音相关 API 会导致编译失败——检出同仓库最新 main 保持一致。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose
  # 语音引擎的 CUDA 后端只在 release 里用到，但它的代码在 libximecore：
  # feature 名改了、candle 升了、kernel 编译方式变了，都要等到打 tag 才发现，
  # 那时已经来不及。这个 job 每次 push/PR 就按 release 的同款工具链
  # （CUDA 12.6.3 + gcc-12）编一遍 speechd，并用 cuobjdump 确认 kernel 真进了
  # 二进制——只靠链接成功是不够的，工具链静默跳过编译时链接照样过。
  #
  # 为什么不是 12.4：NVIDIA 的 ubuntu2404 仓库（runner 是 24.04）里最早只有
  # cuda-12-5，`cuda-12-4` 根本不存在，装它只会得到 "Unable to locate
  # package"。要留在 12.x 的 soname（libcudart.so.12）里，12.6.3 是最近的一个
  # 可装版本；minor version compatibility 保证 12.x 驱动都能跑。
  cuda-speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config gcc-12 g++-12

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.3'
          method: 'network'

      # cudarc 的 build.rs 是直接 `nvcc --version`（不认 CUDA_HOME），PATH 里
      # 没有 nvcc 时报错信息很难懂；这里先钉死一条，失败点一眼可见。
      - name: Verify nvcc
        run: |
          nvcc --version
          echo "CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}"

      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 缓存 key 不含 libximecore 的锁文件（在 workspace 外，hashFiles 取不到）。
      # 固定 key 的代价只是「命中旧缓存、增量重编变动的 crate」，比每次从零
      # 编 candle kernel 便宜得多。
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../libximecore/target
          key: cuda-speech-${{ runner.os }}-v1
          restore-keys: |
            cuda-speech-${{ runner.os }}-

      - name: Build speech daemon with CUDA
        env:
          CUDA_COMPUTE_CAP: '80'
          NVCC_CCBIN: /usr/bin/g++-12
        run: |
          cargo build --release \
            --manifest-path ../libximecore/Cargo.toml \
            -p xime-speechd --features cuda
          BIN=../libximecore/target/release/xime-speechd

          # 1) 确实链到了 CUDA 运行时（动态链接，编译期不需要 GPU）
          ldd "$BIN" | grep -q libcudart \
            || { echo "::error::speechd 没有链接 libcudart"; exit 1; }

          # 2) kernel 真的编进去了，且架构是 CUDA_COMPUTE_CAP 钉的那个
          #    （action 不一定把 CUDA bin 放进 PATH，/usr/local/cuda 这个软链也
          #      不是每个版本都建——先查 PATH，再在所有 cuda-*/bin 里挑最新的）
          CUOBJDUMP=$(command -v cuobjdump \
            || ls -d /usr/local/cuda*/bin/cuobjdump 2>/dev/null | sort -V | tail -1)
          test -n "$CUOBJDUMP" || { echo "::error::找不到 cuobjdump，CUDA 工具链没装好"; exit 1; }
          "$CUOBJDUMP" -lelf "$BIN" > /tmp/cubins.txt
          CUBINS=$(grep -c '\.sm_80\.cubin' /tmp/cubins.txt || true)
          echo "内嵌 sm_80 cubin：${CUBINS} 个"
          test "$CUBINS" -gt 0 \
            || { echo "::error::没有 sm_80 cubin，candle kernel 没编进二进制"; exit 1; }
