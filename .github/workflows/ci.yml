name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发：想立刻要一个安装包，又不想打 tag 时用（产物挂在本次 run 的
  # artifacts 上，不建 Release）。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # .cargo/config.toml 把 libximecore patch 到 ../libximecore（本地开发
      # 工作流）；CI 上不存在该路径时 cargo 回退 Cargo.lock 锁定的旧 rev，
      # 缺语音相关 API 会导致编译失败——检出同仓库最新 main 保持一致。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

  # 安装包：把 CPU 版 .deb 打出来挂在本次 run 的 artifacts 上。
  #
  # 为什么不复用 build job：打包要多装 cargo-deb、多编一遍 CPU 版 speechd，
  # 而且 PR 上编出来的包没人会下载——那条链路越短越好，包这条另起一个 job，
  # 只在 push / 手动触发时跑。
  #
  # 正式发版仍然走 release.yml（打 tag → Releases 页面，CPU + CUDA 两个变体
  # + rpm + arch + 源码包）；这里只出一个 CPU 版，供推送后就手边试用。
  package:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librime-dev \
            libdbus-1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            pkg-config

      # clone 只为了装 xime-speechd（它不在本仓库）。
      #
      # 这里**故意不写 [patch]**，别再加回来。XimeChe 自己直接依赖 librime，而
      # xime-config 又用 path 依赖指向同一个 librime（crates/xime-config/Cargo.toml
      # 里 `librime = { path = "../librime" }`）。只要把 xime-config 单独 patch 到
      # 本地副本、librime 仍走 git，图里就会出现两份 librime-sys2（一份 path、
      # 一份 git），两者都声明 links = "rime"，cargo 在解析阶段直接失败：
      #   package `librime-sys2` links to the native library `rime`, but it
      #   conflicts with a previous package which links to `rime` as well
      # 全量 patch（连 librime 一起）能过，但那就得给 clone 加 --recurse-submodules
      # 让 librime-sys2 编得出 C++ 库，白花几分钟。
      #
      # 现状：主程序按 Cargo.toml 的 git 依赖解析（与上面 build job 完全同一条路，
      # 已被反复验证），speechd 用这份 clone 的独立工作区编，两边都取 libximecore
      # main 的 HEAD。speechd 只依赖 xime-speech-service、不碰 librime，所以
      # --depth 1 不带子模块足够。
      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ../libximecore/target
          key: ${{ runner.os }}-cargo-deb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deb-
            ${{ runner.os }}-cargo-

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "打包版本：$VERSION"

      # 一个入口把「主程序 + CPU 版 speechd + cargo deb + 包内容自查」全做掉。
      # 逻辑只维护 packaging/build-deb.sh 一份，CI 与本地不会走偏；自查那步会
      # 解开包确认 usr/bin 下四个二进制齐全、speechd 不是 CUDA 版。
      - name: Build CPU deb
        run: ./packaging/build-deb.sh cpu

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: xime-${{ steps.version.outputs.version }}-amd64.deb
          path: target/deb-out/*.deb
          if-no-files-found: error
          retention-days: 14

  # 语音引擎的 CUDA 后端只在 release 里用到，但它的代码在 libximecore：
  # feature 名改了、candle 升了、kernel 编译方式变了，都要等到打 tag 才发现，
  # 那时已经来不及。这个 job 每次 push/PR 就按 release 的同款工具链
  # （CUDA 12.6 + gcc-12）编一遍 speechd，并用 cuobjdump 确认 kernel 真进了
  # 二进制——只靠链接成功是不够的，工具链静默跳过编译时链接照样过。
  #
  # 为什么不是 12.4：NVIDIA 的 ubuntu2404 仓库（runner 是 24.04）里最早只有
  # cuda-12-5，`cuda-12-4` 根本不存在，装它只会得到 "Unable to locate
  # package"。留在 12.x 的 soname（libcudart.so.12）里就行；minor version
  # compatibility 保证 12.x 驱动都能跑。
  cuda-speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config gcc-12 g++-12

      # 直接用 NVIDIA 的 apt 源，不走 Jimver/cuda-toolkit。两个理由：
      #   1) 那个 action 的「可用版本」是源码里写死的数组（v0.2.19 最新只到
      #      12.6.2），写 12.6.3 直接 "Version not available"——版本由它决定，
      #      不是由源里有什么决定；
      #   2) 它 apt 装的是 `cuda-12-6` 元包，依赖链会带 `nvidia-open-560`
      #      驱动包（CI 上没有 GPU，装上也不会加载，纯浪费几分钟）。
      # 只装「编译器 + 开发库」：nvcc、cuobjdump、cudart/cublas/curand 齐全，
      # 不碰驱动、nsight、documentation。补丁版本由源决定（现为 12.6.3），
      # soname 仍是 libcudart.so.12，对用户包没有影响。
      - name: Install CUDA toolkit
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-compiler-12-6 cuda-libraries-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      # cudarc 的 build.rs 是直接 `nvcc --version`（不认 CUDA_HOME），PATH 里
      # 没有 nvcc 时报错信息很难懂；这里先钉死一条，失败点一眼可见。
      - name: Verify nvcc
        run: |
          nvcc --version
          echo "CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}"

      - name: Checkout libximecore
        run: git clone --depth 1 https://github.com/ximeiorg/libximecore.git ../libximecore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 缓存 key 不含 libximecore 的锁文件（在 workspace 外，hashFiles 取不到）。
      # 固定 key 的代价只是「命中旧缓存、增量重编变动的 crate」，比每次从零
      # 编 candle kernel 便宜得多。
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../libximecore/target
          key: cuda-speech-${{ runner.os }}-v1
          restore-keys: |
            cuda-speech-${{ runner.os }}-

      - name: Build speech daemon with CUDA
        env:
          CUDA_COMPUTE_CAP: '80'
          NVCC_CCBIN: /usr/bin/g++-12
        run: |
          cargo build --release \
            --manifest-path ../libximecore/Cargo.toml \
            -p xime-speechd --features cuda
          BIN=../libximecore/target/release/xime-speechd

          # 1) 确实链到了 CUDA 运行时（动态链接，编译期不需要 GPU）
          ldd "$BIN" | grep -q libcudart \
            || { echo "::error::speechd 没有链接 libcudart"; exit 1; }

          # 2) kernel 真的编进去了，且架构是 CUDA_COMPUTE_CAP 钉的那个
          #    （action 不一定把 CUDA bin 放进 PATH，/usr/local/cuda 这个软链也
          #      不是每个版本都建——先查 PATH，再在所有 cuda-*/bin 里挑最新的）
          CUOBJDUMP=$(command -v cuobjdump \
            || ls -d /usr/local/cuda*/bin/cuobjdump 2>/dev/null | sort -V | tail -1)
          test -n "$CUOBJDUMP" || { echo "::error::找不到 cuobjdump，CUDA 工具链没装好"; exit 1; }
          "$CUOBJDUMP" -lelf "$BIN" > /tmp/cubins.txt
          CUBINS=$(grep -c '\.sm_80\.cubin' /tmp/cubins.txt || true)
          echo "内嵌 sm_80 cubin：${CUBINS} 个"
          test "$CUBINS" -gt 0 \
            || { echo "::error::没有 sm_80 cubin，candle kernel 没编进二进制"; exit 1; }
