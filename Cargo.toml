[workspace]
resolver = "2"
members = [
    "crates/xime-wayland",
    "crates/xime-xkb",
    "crates/xime-ui",
    "crates/xime-daemon",
    "crates/xime-launcher",
    "crates/xime-tray",
    "crates/xime-setup",
    "crates/xime-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/xime-wayland"

[workspace.dependencies]
# libximecore — shared crates (git dep, patched to local for development)
librime = { git = "https://github.com/ximeiorg/libximecore.git", package = "librime" }
xime-config = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-config" }
xime-setup-lib = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-setup-lib" }

# local crates
xime-wayland = { path = "crates/xime-wayland" }
xime-xkb = { path = "crates/xime-xkb" }
xime-ui = { path = "crates/xime-ui" }
xime-tray = { path = "crates/xime-tray" }

thiserror = "2.0.18"
once_cell = "1.17"
anyhow = "1.0"
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.3"

