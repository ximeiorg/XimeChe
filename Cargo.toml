[workspace]
resolver = "2"
members = [
    "crates/librime-sys",
    "crates/librime",
    "crates/xime-wayland",
    "crates/xime-xkb",
    "crates/xime-ui",
    "crates/xime-core",
    "crates/xime-daemon",
    "crates/xime-launcher",
    "crates/xime-tray",
    "crates/xime-setup",
    "crates/xime-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/xime-wayland"

[workspace.dependencies]
librime-sys2 = { path = "crates/librime-sys" }
librime = { path = "crates/librime" }
xime-wayland = { path = "crates/xime-wayland" }
xime-xkb = { path = "crates/xime-xkb" }
xime-ui = { path = "crates/xime-ui" }
xime-tray = { path = "crates/xime-tray" }
thiserror = "2.0.18"
once_cell = "1.17"
anyhow = "1.0"
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"