[workspace]
resolver = "2"
members = [
    "crates/xime-wayland",
    "crates/xime-xkb",
    "crates/xime-ui",
    "crates/xime-clipboard",
    "crates/xime-daemon",
    "crates/xime-launcher",
    "crates/xime-tray",
    "crates/xime-setup",
    "crates/xime-pack",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/XimeChe"

[workspace.dependencies]
# libximecore — shared crates (git dep, patched to local for development)
librime = { git = "https://github.com/ximeiorg/libximecore.git", package = "librime" }
xime-config = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-config" }
xime-setup-lib = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-setup-lib" }
xime-plugin = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-plugin" }
xime-speech = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-speech" }
# 跨设备剪贴板 P2P 传输层。rev 必须与 libximecore 里 xime-setup-lib 的
# optional 依赖一致，否则同一仓会解析出两份 git 源。
# ca07a02：b19ecde 的公告角色/连上补发/发现重读，加上公告端口 SO_REUSEADDR。
xime-p2p = { git = "https://github.com/ximeiorg/libximep2p.git", rev = "ca07a02c73edcb56fefb4aaf7eda45d6c720a24f" }

# local crates
xime-wayland = { path = "crates/xime-wayland" }
xime-xkb = { path = "crates/xime-xkb" }
xime-ui = { path = "crates/xime-ui" }
xime-tray = { path = "crates/xime-tray" }
xime-clipboard = { path = "crates/xime-clipboard" }

thiserror = "2.0.21"
once_cell = "1.17"
anyhow = "1.0.104"
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.1.6+spec-1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.3"
serde_json = "1.0.154"
