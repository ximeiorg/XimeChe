[workspace]
resolver = "2"
members = [
    "crates/xime-wayland",
    "crates/xime-xkb",
    "crates/xime-ui",
    "crates/xime-clipboard",
    "crates/xime-daemon",
    "crates/xime-launcher",
    "crates/xime-tray",
    "crates/xime-setup",
    "crates/xime-pack",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/XimeChe"

[workspace.dependencies]
# libximecore — shared crates (git dep, patched to local for development)
librime = { git = "https://github.com/ximeiorg/libximecore.git", package = "librime" }
xime-config = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-config" }
xime-setup-lib = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-setup-lib" }
xime-plugin = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-plugin" }
# 语音识别的**客户端**半（protocol + socket transport）。必须关掉默认 feature：
# 默认的 `server` 会把 candle 与 cpal 链进输入法进程，那是 speechd 的活。
xime-speech-service = { git = "https://github.com/ximeiorg/libximecore.git", package = "xime-speech-service", default-features = false }
# 跨设备剪贴板 P2P 传输层。rev 必须与 libximecore 里 xime-setup-lib 的
# optional 依赖一致，否则同一仓会解析出两份 git 源。
# db9dbc8：已配对设备存储移出协议库（宿主用 xime.db 的 p2p_peers 表），
# 配对发现改用独立端口。rev 必须与 libximecore 里 xime-setup-lib 的 optional
# 依赖一致，否则同一仓会解析出两份 git 源。
xime-p2p = { git = "https://github.com/ximeiorg/libximep2p.git", rev = "db9dbc8f8d5b77d53d746524bf30cb0a8c05317b" }

# local crates
xime-wayland = { path = "crates/xime-wayland" }
xime-xkb = { path = "crates/xime-xkb" }
xime-ui = { path = "crates/xime-ui" }
xime-tray = { path = "crates/xime-tray" }
xime-clipboard = { path = "crates/xime-clipboard" }

thiserror = "2.0.21"
once_cell = "1.17"
anyhow = "1.0.104"
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.1.6+spec-1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.3"
serde_json = "1.0.154"
