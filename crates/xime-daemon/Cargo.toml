[package]
name = "xime-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
xime-config.workspace = true
xime-plugin.workspace = true
xime-wayland.workspace = true
xime-xkb.workspace = true
xime-ui.workspace = true
xime-clipboard.workspace = true
xime-tray.workspace = true
xime-speech.workspace = true
librime.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_yaml.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
zbus = "5"
nix = { version = "0.31.3", features = ["fs", "mman"] }
# clean_exit 里用 _exit 跳过 C++ 静态析构（librime 静态 Service 析构会段错误）。
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
chrono = "0.4"
futures-lite = "2"
sha2 = "0.10"
serde_json = "1"
# 语音听写（P10）：音频采集走 PulseAudio 简单 API（speech.rs 内嵌 dlopen
# 绑定，PipeWire 经 pipewire-pulse 兼容），构建零系统依赖。
libloading = "0.8"
# 模型下载与解压（ModelScope tar.bz2）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls-native-roots"] }
tar = "0.4"
bzip2 = "0.5"

[dev-dependencies]
tempfile = "3"
zip = "8.6.0"