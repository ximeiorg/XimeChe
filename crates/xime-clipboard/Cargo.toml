[package]
name = "xime-clipboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
# 剪贴板存储复用 libximecore 的统一实现（xime.db），本 crate 不再直接依赖
# rusqlite——那也顺带消掉了 libsqlite3-sys 的 links = "sqlite3" 冲突风险。
xime-config.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# 写回系统剪贴板：Linux 走 wl-clipboard-rs 的 data-control 后端，与
# libximecore 设置程序、ximed 桌面端同一套实现。
arboard = { version = "3.7.0", features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
