[package]
name = "xime"
version = "0.1.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/xime-wayland"
description = "Xime - A Wayland input method for Chinese (Wubi)"

[dependencies]
xime-daemon = { path = "../xime-daemon" }
xime-launcher = { path = "../xime-launcher" }
xime-setup = { path = "../xime-setup" }

[package.metadata.deb]
maintainer = "Kor1 <kingzcheung@gmail.com>"
copyright = "2026, Kor1"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Xime (曦码) is a pure Rust implementation of a Chinese input method 
for Linux Wayland, using Rime engine and self-drawn UI."""
depends = "librime1 (>= 1.8), libxkbcommon0 (>= 1.0)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/xime-daemon", "usr/bin/", "755"],
    ["target/release/xime-launcher", "usr/bin/", "755"],
    ["target/release/xime-setup", "usr/bin/", "755"],
    ["../../resources/dbus/org.xime.Xime.service", "usr/share/dbus-1/services/", "644"],
    ["../../resources/applications/xime-launcher.desktop", "usr/share/applications/", "644"],
    ["../../resources/icons/scalable/xime.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
recommends = "rime-data-wubi"