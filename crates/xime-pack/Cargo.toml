[package]
name = "xime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/ximeiorg/xime-wayland"
description = "Xime - A Wayland input method for Chinese (Wubi)"

[dependencies]
xime-daemon = { path = "../xime-daemon" }
xime-launcher = { path = "../xime-launcher" }
xime-setup = { path = "../xime-setup" }

[package.metadata.deb]
maintainer = "Kor1 <kingzcheung@gmail.com>"
copyright = "2026, Kor1"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Xime (曦码) is a pure Rust implementation of a Chinese input method 
for Linux Wayland, using Rime engine and self-drawn UI.

This package ships the CPU build of the speech recognition daemon
(xime-speechd). On machines with an NVIDIA GPU, install xime-cuda
instead to get the CUDA build (much lower latency, streaming text)."""
# libasound2：语音守护进程用 cpal 录音（ALSA）。Debian 13 / Ubuntu 24.04
# 起包名改成 libasound2t64（64 位 time_t 过渡），两种名字都写上。
depends = "librime1 (>= 1.8), libxkbcommon0 (>= 1.0), libwayland-client0, libdbus-1-3, libbz2-1.0, libasound2 | libasound2t64"
section = "utils"
priority = "optional"
assets = [
    ["target/release/xime-daemon", "usr/bin/", "755"],
    ["target/release/xime-launcher", "usr/bin/", "755"],
    ["target/release/xime-setup", "usr/bin/", "755"],
    # 语音识别是独立进程，daemon 按「同目录 → PATH」拉起它。
    ["target/release/xime-speechd", "usr/bin/", "755"],
    ["../../resources/xime.yaml", "usr/share/xime/", "644"],
    ["../../resources/dbus/org.xime.Xime.service", "usr/share/dbus-1/services/", "644"],
    ["../../resources/applications/xime-launcher.desktop", "usr/share/applications/", "644"],
    ["../../resources/applications/xime-setup.desktop", "usr/share/applications/", "644"],
    ["../../resources/icons/48x48/apps/xime.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../resources/icons/64x64/apps/xime.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../resources/icons/128x128/apps/xime.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../resources/icons/256x256/apps/xime.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../resources/icons/512x512/apps/xime.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../rime-wubi/*.yaml", "usr/share/xime/rime-data/", "644"],
    ["../../rime-wubi/lua/*.lua", "usr/share/xime/rime-data/lua/", "644"],
]
recommends = "rime-data-wubi"

# CUDA 变体：包名自动为 `xime-cuda`，产物 `xime-cuda_<ver>_amd64.deb`。
#
# 与 xime 包**互斥**：两者都装 /usr/bin/xime-speechd，只是后端不同。CI 在打
# 这个包之前把 CUDA 版 speechd 放到 target/release/xime-speechd（CPU 版同名
# 文件会被覆盖），所以除 depends 之外的文件清单直接继承上面。
#
# 为什么不把 CUDA 库写进 Depends：Ubuntu / Debian 官方仓库没有 libcudart12，
# 硬依赖会让这个包在任何干净系统上都装不上。缺库时 speechd 启动会失败，
# daemon 会在设置页/通知里报错；description 里已经写明需要 NVIDIA 驱动。
[package.metadata.deb.variants.cuda]
depends = "librime1 (>= 1.8), libxkbcommon0 (>= 1.0), libwayland-client0, libdbus-1-3, libbz2-1.0, libasound2 | libasound2t64"
recommends = "rime-data-wubi"
conflicts = "xime"
replaces = "xime"
extended-description = """\
Xime (曦码) is a pure Rust implementation of a Chinese input method 
for Linux Wayland, using Rime engine and self-drawn UI.

This package ships the CUDA build of the speech recognition daemon
(xime-speechd). It requires an NVIDIA GPU with a working driver and
the CUDA 12 runtime (libcudart.so.12, libcublas.so.12, libcurand.so.10),
e.g. the cuda-cudart-12-4 / libcublas12 packages from NVIDIA's
CUDA repository. Without them speech recognition will not start.

It conflicts with the plain xime package (same files, different
backend); apt will offer to replace it."""
